<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TRANSFORMA</title>

    <!-- Fonte: Turn Me Into A Girl!-->
    <link href="https://fonts.googleapis.com/css?family=Eczar|Kalam|Merriweather" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

        <style>
        body{
            background-color: purple;
            font-family: 'Merriweather', 
            serif; font-weight: lighter;       
        }

        h1{ font-family: "Roboto", sans-serif; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <!-- CARD CENTRALIZADO -->
                <div class="rounded-5 p-4 p-md-5 shadow-lg text-center bg-white">
                    
                    <!-- TÍTULO / LOGO -->
                    <h1 class="fs-2 text-uppercase rounded-5" style="background-color: purple;"><span style="color: lightskyblue;">TR</span><span style="color: pink;">AN</span><span style="color: white;">SF</span><span style="color: pink;">OR</span><span style="color: lightskyblue;">MA</span></h1>
                    <p class="text-muted small mb-4">Acesse sua conta para continuar</p>

                    <!-- FORMULÁRIO -->
                    {% load widget_tweaks %} <!-- 1. IMPORTANTE: Carrega a biblioteca no topo do arquivo -->

                    <form method="POST" enctype="multipart/form-data" class="text-start">
                        {% csrf_token %}
                        
                        {% for field in form %}
                            <div class="mb-3">
                                <!-- Renderiza a label com a classe do Bootstrap -->
                                <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                                    {{ field.label }}
                                </label>
                                
                                <!-- Injeta a classe form-control diretamente no input do Django -->
                                {{ field|add_class:"form-control py-2" }}
                                
                                <!-- Exibe erros de validação caso existam -->
                                {% if field.errors %}
                                    <div class="text-danger small mt-1">
                                        {{ field.errors.0 }}
                                    </div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success rounded-pill py-2 fw-bold fs-5 shadow-sm">
                                Cadastrar
                            </button>
                        </div>
                    </form>
                    
                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'login' %}" class="btn">Voltar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Importação do jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
    $(document).ready(function() {
        // 1. MÁSCARA E VALIDAÇÃO DE CNPJ (XX.XXX.XXX/XXXX-XX)
        $('input[name="cnpj"]').on('input', function() {
            let v = $(this).val().replace(/\D/g, ''); // Remove não dígitos
            if (v.length > 14) v = v.slice(0, 14);
            
            v = v.replace(/^(\d{2})(\d)/, '$1.$2');
            v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
            v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
            v = v.replace(/(\d{4})(\d)/, '$1-$2');
            
            $(this).val(v);
        });

        // 2. MÁSCARA E VALIDAÇÃO DE TELEFONE ((XX) XXXXX-XXXX)
        $('input[name="telefone"]').on('input', function() {
            let v = $(this).val().replace(/\D/g, ''); // Remove não dígitos
            if (v.length > 11) v = v.slice(0, 11);

            v = v.replace(/^(\d{2})(\d)/g, '($1) $2');
            v = v.replace(/(\d{5})(\d)/, '$1-$2');

            $(this).val(v);
        });

        // 3. VALIDAÇÃO DE SENHA
        const $senha = $('input[name="password"], input[name="senha"]');
        const $confirmSenha = $('input[name="password_confirm"], input[name="confirmar_senha"]');
        
        $confirmSenha.after('<small id="senha-feedback" class="d-block mt-1 fw-bold"></small>');
        const $feedback = $('#senha-feedback');

        function checarSenhas() {
            const pass = $senha.val();
            const confirm = $confirmSenha.val();

            if (!confirm) {
                $feedback.text('');
                return true;
            }

            if (pass === confirm) {
                $feedback.text('✓ As senhas coincidem').css('color', 'green');
                return true;
            } else {
                $feedback.text('✕ As senhas não coincidem').css('color', 'red');
                return false;
            }
        }

        $senha.add($confirmSenha).on('keyup change', checarSenhas);

        $('form').on('submit', function(e) {
            if (!checarSenhas()) {
                e.preventDefault();
                alert('Por favor, verifique a confirmação de senha.');
            }
        });
    });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
