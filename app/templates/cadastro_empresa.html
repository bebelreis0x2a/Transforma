<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Empresa</title>
</head>
<body>
    <h2>Cadastro de Empresa</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit">Cadastrar Empresa</button>
    </form>

    <p>Já tem conta? <a href="{% url 'login' %}">Faça login aqui</a></p>
</body>
</html>
