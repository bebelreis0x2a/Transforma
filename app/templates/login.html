<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TRANSFORMA</title>

    <!-- Fonte: Turn Me Into A Girl!-->
    <link href="https://fonts.googleapis.com/css?family=Eczar|Kalam|Merriweather" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        body{
            background-color: purple;
            font-family: "Roboto", sans-serif;
        }

        main{ 
            font-family: 'Merriweather', 
            serif; font-weight: lighter; 
        }

    </style>

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <!-- CARD CENTRALIZADO -->
                <div class="rounded-5 p-4 p-md-5 shadow-lg text-center">
                    
                    <!-- TÍTULO / LOGO -->
                    <h1 class="fs-2 text-uppercase text-primary mb-1">TRANSFORMA</h1>
                    <p class="text-muted small mb-4">Acesse sua conta para continuar</p>

                    <!-- FORMULÁRIO -->
                    <form method="POST" class="text-start">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            {{ form.as_p }} <!-- Renderiza os campos nativos de Usuário (E-mail) e Senha -->
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold fs-5 shadow-sm">
                                Entrar
                            </button>
                        </div>
                    </form>

                    <hr class="my-4 text-muted">

                    <p class="mb-2 fw-semibold text-secondary">Ainda não tem conta?</p>
                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                        <a href="{% url 'cadastro_pessoa' %}" class="btn btn-outline-primary rounded-pill btn-sm fw-semibold">
                            Cadastrar como Pessoa
                        </a>
                        <a href="{% url 'cadastro_empresa' %}" class="btn btn-outline-primary rounded-pill btn-sm fw-semibold">
                            Cadastrar como Empresa
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
